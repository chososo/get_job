    <nav aria-label="공고와 일정">

      <a href="#corporate">대기업 · 재무·전략 <span>＋</span></a>
      <a href="#overseas">해외 공고 <span>GL</span></a>
      <a href="#calendar">지원 캘린더 <span>▦</span></a>
      <a href="#favorites">중요 공고 <span>☆</span></a>
